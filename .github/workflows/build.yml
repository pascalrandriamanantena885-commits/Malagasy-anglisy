name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Wiktionary data (build time only)
        continue-on-error: true
        run: |
          mkdir -p data/raw
          curl -fL --retry 3 -o data/raw/kaikki-mg.jsonl \
            https://kaikki.org/dictionary/Malagasy/kaikki.org-dictionary-Malagasy.jsonl
          python tools/import_kaikki.py data/raw/kaikki-mg.jsonl data/wiktionary.csv
      - name: Build dictionary.db
        run: python tools/build_db.py --out app/src/main/assets/dictionary.db data/words.csv data/wiktionary.csv
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
